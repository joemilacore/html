<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>我的第二個網頁 - 新按鈕指令</title>
</head>
<body>

    <h1 id="myTitle">哈囉，世界！</h1>
    <p>這是我在 GitHub 上的新檔案。</p>

    <!-- 原本的第一個按鈕 -->
    <button onclick="alert('你點到我了！')">點我一下</button>

    <!-- 這是新加的第二個按鈕與指令 -->
    <button onclick="document.getElementById('myTitle').innerText = '文字被按鈕改變了！'">改變標題文字</button>

</body>
</html>
